[project]
name = "to-catch-a-churner"
version = "1.0.0"
description = "Telco customer churn prediction: EDA, preprocessing, and model comparison (Random Forest, SVC, XGBoost) with rigorous cross-validation and held-out evaluation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imblearn>=0.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "xgboost>=3.4.1",
]
